evaluation:
  protocol_id: protocol_v1
  domains: both
  metrics:
    # Inventário descritivo das métricas principais; 5_avaliar_batch_wsl.py não usa esta lista como seletor.
    finqa: [exact_match, numeric_accuracy, mae_numeric_parseable, mre_numeric_parseable]
    failure: [subset_accuracy, precision_macro, recall_macro, f1_macro, precision_micro, recall_micro, f1_micro, jaccard_samples, exact_match, parse_failures]
  numeric_tolerance:
    absolute: 0.001
    relative: 0.001
  generation:
    max_new_tokens: 32
    max_input_length: 4096
    batch_size: 8
    temperature: 0.0
    top_p: 0.9
    top_k: 50
    do_sample: false
    repetition_penalty: 1.0
paths:
  test_data_path: data/processed/hybrid_v1/test.jsonl
